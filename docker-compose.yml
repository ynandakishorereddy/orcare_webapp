version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
      - fastapi

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - .env

  fastapi:
    build:
      context: ./fastapi_backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploads
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  chroma_data:
  uploads_data:
  redis_data:
